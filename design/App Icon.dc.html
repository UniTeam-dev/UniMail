<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:{{ size }}px; height:{{ size }}px; position:relative">
  <div style="position:absolute; left:0; top:0; width:1024px; height:1024px; transform:scale({{ k }}); transform-origin:0 0">
    <div style="position:absolute; left:100px; top:100px; width:824px; height:824px; border-radius:185px; background:{{ base }}; box-shadow:{{ baseShadow }}; overflow:hidden">
      <div style="position:absolute; inset:0; background:{{ sheen }}"></div>
      <div style="position:absolute; left:142px; top:176px; width:540px; height:380px; border-radius:64px; background:#8C5CF5; transform:rotate(-9deg) translate(-18px,-34px); opacity:0.95"></div>
      <div style="position:absolute; left:142px; top:176px; width:540px; height:380px; border-radius:64px; background:#FA8C33; transform:rotate(-4deg) translate(-6px,-6px)"></div>
      <div style="position:absolute; left:142px; top:176px; width:540px; height:380px; border-radius:64px; background:#14B8BF; transform:rotate(3deg) translate(8px,22px)"></div>
      <div style="position:absolute; left:142px; top:258px; width:540px; height:380px; border-radius:64px; background:{{ front }}; overflow:hidden; box-shadow:0 30px 60px rgba(20,20,60,0.28), inset 0 0 0 2px rgba(255,255,255,0.12)">
        <div style="position:absolute; left:70px; top:-300px; width:400px; height:400px; border-radius:56px; background:{{ flap }}; transform:rotate(45deg)"></div>
        <div style="position:absolute; left:70px; top:-316px; width:400px; height:400px; border-radius:56px; background:rgba(255,255,255,0.14); transform:rotate(45deg)"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:1024},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1024,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const size=this.props.size||1024,dark=this.props.variant==='dark';
    return {size,k:size/1024,
      base:dark?'linear-gradient(170deg,#2B2B33,#141418)':'linear-gradient(170deg,#FFFFFF,#E9EAF1)',
      baseShadow:dark?'0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(255,255,255,0.08)':'0 30px 60px rgba(30,30,60,0.22), inset 0 0 0 2px rgba(0,0,0,0.04)',
      sheen:dark?'radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,0.08), transparent 60%)':'radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,0.9), transparent 60%)',
      front:dark?'linear-gradient(160deg,#5E86FF,#3D5CE0)':'linear-gradient(160deg,#4F7BFF,#3553E6)',
      flap:dark?'#7497FF':'#6F92FF'};
  }
}
</script>
</body>
</html>
